name: sia_photos
description: Personal photo and video backup to the Sia network.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  sia_storage: 0.3.1
  flutter_rust_bridge: 2.12.0
  photo_manager: 3.12.0
  workmanager: 0.10.10
  flutter_secure_storage: 11.2.0
  sqflite: 2.4.4+1
  path: ^1.9.1
  path_provider: 2.1.6
  url_launcher: 6.3.3
  crypto: 3.0.7
  connectivity_plus: 7.3.2
  video_player: 2.14.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
